        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let newArr = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArr[currentIndex], newArr[randomIndex]] = [newArr[randomIndex], newArr[currentIndex]];
            }
            return newArr;
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const shuffledOptions = shuffle(q.options);
                
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${q.id}`;

                let html = `<div class="question-title">${index + 1}. ${q.title}</div>`;
                html += `<ul class="answers-list" id="list-${q.id}">`;

                shuffledOptions.forEach((opt, optIndex) => {
                    const inputId = `q${q.id}_opt${optIndex}`;
                    const inputType = q.type;
                    const inputName = `question_${q.id}`;
                    
                    html += `
                        <li id="li_${inputId}">
                            <label for="${inputId}">
                                <input type="${inputType}" id="${inputId}" name="${inputName}" data-correct="${opt.correct}">
                                <span>${opt.text}</span>
                                <span class="status-tag" id="status_${inputId}"></span>
                            </label>
                        </li>
                    `;
                });

                html += `</ul>`;
                html += `<button class="btn-check" onclick="checkAnswer(${q.id})">Sprawdź</button>`;
                html += `<div class="feedback" id="feedback-${q.id}"></div>`;

                if (q.explanation) {
                    html += `
                        <div class="explanation-box" id="explanation-${q.id}">
                            <div class="orig-text">${q.explanation.orig}</div>
                            <div class="noob-expl">${q.explanation.noob}</div>
                        </div>
                    `;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function checkAnswer(questionId) {
            const card = document.getElementById(`question-${questionId}`);
            const inputs = card.querySelectorAll('input');
            const feedback = document.getElementById(`feedback-${questionId}`);
            const explanationBox = document.getElementById(`explanation-${questionId}`);
            
            let isAllCorrect = true;

            inputs.forEach(input => {
                const li = document.getElementById(`li_${input.id}`);
                const statusTag = document.getElementById(`status_${input.id}`);
                const isCorrectAnswer = input.getAttribute('data-correct') === 'true';
                const isChecked = input.checked;

                // Reset klas podświetlenia
                li.className = '';
                statusTag.innerText = '';

                // Podświetlenie na zielono poprawnych odpowiedzi
                if (isCorrectAnswer) {
                    li.classList.add('option-correct-target');
                    statusTag.innerText = '✓ Prawidłowa';
                    if (!isChecked) {
                        isAllCorrect = false; // Brak zaznaczenia poprawnej opcji
                    }
                } else {
                    // Podświetlenie na czerwono błędnie zaznaczonych opcji
                    if (isChecked) {
                        li.classList.add('option-wrong-selected');
                        statusTag.innerText = '✗ Błędna';
                        isAllCorrect = false;
                    }
                }
            });

            feedback.style.display = 'block';
            
            // Pokazujemy sekcję z objaśnieniem dopiero po kliknięciu Sprawdź
            if (explanationBox) {
                explanationBox.style.display = 'block';
            }

            if (isAllCorrect) {
                feedback.className = 'feedback correct';
                feedback.innerText = 'Świetnie! Zaznaczono dokładnie wszystkie prawidłowe odpowiedzi.';
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerText = 'Wskazano niepełne lub niepoprawne opcje. Prawidłowe opcje zostały podświetlone na zielono, a Twoje błędne zaznaczenia na czerwono.';
            }
        }

        window.onload = renderQuiz;
    </script>
